[project]
name = "firewall-agent"
version = "0.1.0"
description = "Demo agent, relayer and tooling for Eclipse"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai",
    "httpx",
    "jsonschema",
    "python-dotenv",
]

[project.optional-dependencies]
testnet = ["py-near"]

[dependency-groups]
dev = ["pytest"]

[project.scripts]
firewall-demo = "firewall_agent.demo:main"
firewall-eval = "firewall_agent.eval:main"
firewall-relayer = "firewall_agent.relayer:main"
firewall-setup-testnet = "firewall_agent.setup_testnet:main"
firewall-jev-ping = "firewall_agent.jev_ping:main"
firewall-calibrate = "firewall_agent.calibration:main"
firewall-classifier = "firewall_agent.classifier:main"
firewall-nightly-e2e = "firewall_agent.nightly_e2e:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/firewall_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
