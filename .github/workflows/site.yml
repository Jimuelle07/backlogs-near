name: site

# CI only: every PR and push to main touching the site or the files it reads runs the
# tests and the build. Deploys are manual with wrangler (see site/README.md "Deploy").

on:
  pull_request:
    paths:
      - "site/**"
      - "docs/results/**"
      - "schemas/**"
      - "contract/guardian/src/lib.rs"
      - ".github/workflows/site.yml"
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/results/**"
      - "schemas/**"
      - "contract/guardian/src/lib.rs"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
