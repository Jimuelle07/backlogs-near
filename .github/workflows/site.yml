name: site

# CI: every PR touching the site or the files it reads runs the tests and the build.
# CD: every push to main (and manual runs on main) deploys site/dist to the
# Cloudflare Pages project `eclipse` (https://eclipse-9le.pages.dev/).
# Needs repo secrets CLOUDFLARE_API_TOKEN (Account > Cloudflare Pages > Edit)
# and CLOUDFLARE_ACCOUNT_ID; see site/README.md "Deploy".

on:
  pull_request:
    paths:
      - "site/**"
      - "docs/results/**"
      - "schemas/**"
      - "contract/guardian/src/lib.rs"
      - ".github/workflows/site.yml"
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/results/**"
      - "schemas/**"
      - "contract/guardian/src/lib.rs"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: site/dist
          retention-days: 7

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://eclipse-9le.pages.dev/
    concurrency:
      group: site-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.161.0"
          command: pages deploy dist --project-name eclipse --branch main --commit-hash ${{ github.sha }}
