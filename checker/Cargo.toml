[package]
name = "checker"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "checker"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"

[target.'cfg(not(target_os = "wasi"))'.dependencies]
ureq = "3"

[target.'cfg(target_os = "wasi")'.dependencies]
wasi-http-client = "0.2.1"
