<!doctype html>
<!-- Source of public/og.png (1200x630 social preview). Regenerate with a headless browser
     screenshot at 1200x630, e.g. msedge --headless --screenshot=og.png --window-size=1200,630 og-card.html -->
<html lang="en"><head><meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500&family=Geist+Mono:wght@400;500&display=block" rel="stylesheet" />
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: #15131d; color: #eeeaf5; font-family: "Geist", system-ui, sans-serif; display: flex; }
  .card { margin: 40px; flex: 1; border-radius: 28px; background: #edb1e8; color: #1f1226; padding: 64px 72px; display: flex; flex-direction: column; justify-content: space-between; }
  .brand { font: 500 30px "Geist", sans-serif; letter-spacing: -0.02em; display: flex; align-items: center; gap: 14px; }
  .dot { width: 30px; height: 30px; border-radius: 50%; background: #1f1226; box-shadow: inset -9px 0 0 #edb1e8; }
  h1 { margin: 0; font-weight: 400; font-size: 76px; line-height: 1.02; letter-spacing: -0.045em; max-width: 13em; }
  .sub { font: 400 24px/1.4 "Geist", sans-serif; color: #3a2442; max-width: 40em; }
  .row { display: flex; justify-content: space-between; align-items: flex-end; font: 500 18px "Geist Mono", monospace; color: #3a2442; letter-spacing: 0.04em; text-transform: uppercase; }
</style></head>
<body><div class="card">
  <div class="brand"><span class="dot"></span>Eclipse</div>
  <div>
    <h1>Give your agent a wallet, not the keys.</h1>
    <p class="sub">Payment firewall for AI agents on NEAR. Allow, hold or block, and an on-chain receipt for every payment.</p>
  </div>
  <div class="row"><span>NEAR testnet · Jev · OutLayer TEE</span><span>NEAR HACKATHON 2026</span></div>
</div></body></html>
